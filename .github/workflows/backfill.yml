name: Daily Luma Backfill

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 10:00 Paris (heure d'hiver), 1 h après le scrape à 9h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    name: Discover puis backfill des calendriers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover et backfill des nouveaux calendriers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python src/daily_update.py --write 2>&1 | tee "logs/$(date -u +%F)_discover.txt"

      - name: Backfill des calendriers non backfillés
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python src/backfill_all.py --write 2>&1 | tee "logs/$(date -u +%F)_backfill.txt"

      - name: Commit des fichiers de données et des logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ charts/ logs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Aucun changement dans les fichiers de données"
          else
            git commit -m "chore: backfill quotidien $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
